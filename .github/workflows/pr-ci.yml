name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    timeout-minutes: 15
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      AUTH_CALLBACK_URL: ${{ vars.AUTH_CALLBACK_URL }}
      PUBLIC_PARKA_SUPABASE_URL: ${{ vars.PUBLIC_PARKA_SUPABASE_URL }}
      PUBLIC_PARKA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_PARKA_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # log-check diffs origin/<base>...HEAD, needs full history.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Audit (zero vulnerabilities)
        run: pnpm deps:audit

      - name: Outdated (no in-range updates)
        run: pnpm deps:outdated

      - name: Format check
        run: pnpm format:check

      - name: Hash check
        run: pnpm hash:check

      - name: Log check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/log-check.mjs --base "origin/$BASE_REF"

      # e2e stays local-only (pnpm test:e2e): CI webServer lacks Supabase fixtures.
      - name: Verify (lint, types, tests) - parka and its deps
        run: pnpm exec turbo run lint check-types test --filter=parka... --ui=stream
