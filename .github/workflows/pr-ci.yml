name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    timeout-minutes: 15
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      AUTH_CALLBACK_URL: ${{ vars.AUTH_CALLBACK_URL }}
      PUBLIC_PARKA_SUPABASE_URL: ${{ vars.PUBLIC_PARKA_SUPABASE_URL }}
      PUBLIC_PARKA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_PARKA_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # e2e stays local-only (pnpm test:e2e): CI webServer lacks Supabase fixtures.
      - name: Verify (format, lint, types, tests) - parka and its deps
        run: pnpm exec turbo run //#format:check lint check-types test --filter=parka... --filter=// --ui=stream
