name: Deploy Parka

on:
  push:
    branches:
      - main
    paths:
      - apps/parka/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/deploy-parka.yml
  workflow_dispatch:

concurrency:
  group: deploy-parka
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      PUBLIC_PARKA_SUPABASE_URL: ${{ secrets.PUBLIC_PARKA_SUPABASE_URL }}
      PUBLIC_PARKA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_PARKA_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # e2e stays local-only (pnpm test:e2e): CI webServer lacks Supabase fixtures.
      - name: Verify (format, lint, types, tests) - parka and its deps
        run: pnpm exec turbo run //#format:check lint check-types test --filter=parka... --filter=// --ui=stream

  deploy:
    name: deploy
    timeout-minutes: 15
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      PUBLIC_PARKA_SUPABASE_URL: ${{ secrets.PUBLIC_PARKA_SUPABASE_URL }}
      PUBLIC_PARKA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_PARKA_SUPABASE_PUBLISHABLE_KEY }}
      PARKA_AI_API_KEY: ${{ secrets.PARKA_AI_API_KEY }}
      PUBLIC_PARKA_VAPID_PUBLIC_KEY: ${{ secrets.PUBLIC_PARKA_VAPID_PUBLIC_KEY }}
      PARKA_VAPID_PRIVATE_KEY: ${{ secrets.PARKA_VAPID_PRIVATE_KEY }}
      PARKA_VAPID_SUBJECT: ${{ secrets.PARKA_VAPID_SUBJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the previous main commit to diff migrations.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # DB first: new code never runs against an old schema. Always runs: a push
      # diff misses migrations from an earlier failed deploy; push is a no-op when current.
      - name: Migrate DB
        working-directory: apps/parka
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PARKA_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PARKA_SUPABASE_DB_PASSWORD }}
        run: |
          pnpm exec supabase link --project-ref "${{ secrets.PARKA_SUPABASE_PROJECT_REF }}"
          pnpm exec supabase db push

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PARKA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PARKA_CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec turbo run deploy --filter=parka
