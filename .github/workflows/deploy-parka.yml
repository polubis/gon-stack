name: Deploy Parka

on:
  push:
    branches:
      - main
    paths:
      - apps/parka/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/deploy-parka.yml
  workflow_dispatch:

concurrency:
  group: deploy-parka
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      PUBLIC_PARKA_SUPABASE_URL: ${{ secrets.PUBLIC_PARKA_SUPABASE_URL }}
      PUBLIC_PARKA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_PARKA_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # e2e stays local-only (pnpm test:e2e): CI webServer lacks Supabase fixtures.
      - name: Verify (format, lint, types, tests) - parka and its deps
        run: pnpm exec turbo run //#format:check lint check-types test --filter=parka... --filter=// --ui=stream

  deploy:
    name: deploy
    timeout-minutes: 15
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      PUBLIC_PARKA_SUPABASE_URL: ${{ secrets.PUBLIC_PARKA_SUPABASE_URL }}
      PUBLIC_PARKA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_PARKA_SUPABASE_PUBLISHABLE_KEY }}
      PARKA_AI_API_KEY: ${{ secrets.PARKA_AI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Need the previous main commit to diff migrations.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Skip only when the previous commit is known and migrations are untouched.
      - name: Detect migration changes
        id: migrations
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            && git diff --quiet "$BEFORE" "$GITHUB_SHA" -- apps/parka/supabase/migrations; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # DB first: new code never runs against an old schema.
      - name: Migrate DB
        if: steps.migrations.outputs.changed == 'true'
        working-directory: apps/parka
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PARKA_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PARKA_SUPABASE_DB_PASSWORD }}
        run: |
          pnpm exec supabase link --project-ref "${{ secrets.PARKA_SUPABASE_PROJECT_REF }}"
          pnpm exec supabase db push

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PARKA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PARKA_CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec turbo run deploy --filter=parka
