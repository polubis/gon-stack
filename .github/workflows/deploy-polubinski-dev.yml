name: Deploy Polubinski Dev

on:
  push:
    branches:
      - main
    paths:
      - apps/polubinski-dev/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/deploy-polubinski-dev.yml
  workflow_dispatch:

concurrency:
  group: deploy-polubinski-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # e2e stays local-only (pnpm test:e2e).
      - name: Verify (format, lint, types, tests) - polubinski-dev and its deps
        run: pnpm exec turbo run //#format:check lint check-types test --filter=polubinski-dev... --filter=// --ui=stream

  deploy:
    name: deploy
    timeout-minutes: 15
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.POLUBINSKI_DEV_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.POLUBINSKI_DEV_CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec turbo run deploy --filter=polubinski-dev
