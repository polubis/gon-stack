name: Deploy Kdebek

on:
  push:
    branches:
      - main
    paths:
      - apps/kdebek/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/deploy-kdebek.yml
  workflow_dispatch:

concurrency:
  group: deploy-kdebek
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # e2e stays local-only (pnpm test:e2e).
      - name: Verify (format, lint, types, tests) - kdebek and its deps
        run: pnpm exec turbo run //#format:check lint check-types test --filter=kdebek... --filter=// --ui=stream

  deploy:
    name: deploy
    timeout-minutes: 15
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.KDEBEK_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.KDEBEK_CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec turbo run deploy --filter=kdebek
