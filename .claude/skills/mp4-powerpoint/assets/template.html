<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explainer deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@600;700;800&display=block" rel="stylesheet">
<style>
:root{--bg:#050507;--ink:#FFFFFF;--muted:#8A87A0;--violet:#7C5CFF;--soft:#B48CFF;--gold:#E8C547;--teal:#4FD1C5;--rose:#FF6B8A;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;--head:'Sora',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden;background:radial-gradient(ellipse 80% 50% at 50% 100%,rgba(124,92,255,.10),transparent 70%),var(--bg)}
canvas{position:absolute;inset:0;z-index:1}
#bar{position:absolute;top:0;left:0;height:5px;z-index:10;background:linear-gradient(90deg,var(--violet),var(--gold))}
#brand{position:absolute;top:50px;left:72px;z-index:10;display:flex;align-items:center;gap:14px;font:600 26px var(--sans);letter-spacing:-.01em}
#brand i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#D9C8FF,var(--violet) 55%,#3a2399);box-shadow:0 0 18px rgba(124,92,255,.7)}
#count{position:absolute;top:54px;right:72px;z-index:10;font:500 22px var(--mono);color:var(--muted);letter-spacing:.08em}
.slide{position:absolute;inset:0;z-index:2;opacity:0}
.ghost{position:absolute;right:30px;top:40px;font:800 520px/1 var(--head);letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1px rgba(124,92,255,.075);z-index:0}
.copy{position:absolute;top:150px;left:72px;right:72px;z-index:3}
.kicker{display:flex;align-items:center;gap:16px;font:500 24px var(--mono);color:var(--violet);letter-spacing:.04em}
.kicker:before{content:"";width:26px;height:2px;background:var(--violet)}
h1{margin-top:26px;font:800 84px/1.04 var(--head);letter-spacing:-.035em;max-width:936px}
h1 em{font-style:normal;color:var(--soft)}
.sub{margin-top:26px;font:500 24px/1.3 var(--mono);color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
.tags{margin-top:26px;display:flex;gap:14px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);font:500 20px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:#E6E4F0}
.tag:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.abs{position:absolute;z-index:3}
.code{position:absolute;left:72px;right:72px;z-index:3;padding:28px 34px;border-radius:14px;border:1px solid rgba(255,255,255,.1);
  background:linear-gradient(rgba(255,255,255,.03),rgba(255,255,255,.03)),rgba(5,5,7,.94);font:500 28px/1.55 var(--mono);font-variant-ligatures:none}
.ln{white-space:pre;border-radius:6px;margin:0 -12px;padding:0 12px}
.k{color:var(--soft)}.s{color:var(--gold)}.c{color:var(--muted)}.p{color:#CFCBE0}
.del{background:rgba(255,107,138,.12)}.del .m{color:var(--rose)}
.add{background:rgba(79,209,197,.12)}.add .m{color:var(--teal)}
.card{position:absolute;z-index:3;border-radius:18px;border:1px solid rgba(255,255,255,.1);background:#0B0A11;padding:26px 30px}
.pkg{font:500 24px var(--mono);color:var(--muted)}
.ver{margin-top:18px;display:flex;align-items:baseline;gap:16px}
.ver b{font:600 30px var(--sans)}
.ver span{font:700 44px var(--mono);letter-spacing:-.02em}
.hub{position:absolute;z-index:3;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 22px var(--mono);color:var(--hc);
  background:radial-gradient(circle,rgba(var(--hr),.38),rgba(var(--hr),.08) 70%),#0B0A11;border:1px solid rgba(var(--hr),.6);box-shadow:0 0 40px rgba(var(--hr),.35)}
.node{position:absolute;z-index:3;height:50px;width:184px;display:flex;align-items:center;justify-content:center;border-radius:999px;font:500 21px var(--mono);
  background:#0B0A11;border:1px solid rgba(255,255,255,.14);color:#E6E4F0}
.cmd{position:absolute;z-index:3;left:50%;transform:translateX(-50%);padding:14px 30px;border-radius:999px;font:600 28px var(--mono);color:var(--gold);background:#0B0A11;border:1px solid rgba(232,197,71,.45)}
.note{font:500 28px/1.35 var(--sans);color:var(--muted);text-align:center}
.note b{color:var(--ink);font-weight:600}
.tip{left:72px;right:72px;height:190px}
.tip .t{font:600 31px var(--mono);font-variant-ligatures:none}
.tip .d{margin-top:16px;font:400 27px/1.35 var(--sans);color:var(--muted)}
.tip .badge{position:absolute;top:26px;right:28px;font:500 19px var(--mono);color:var(--teal);border:1px solid rgba(79,209,197,.4);border-radius:999px;padding:6px 14px}
.tip h3{font:700 34px var(--head);letter-spacing:-.02em}
.tip h3 em{font-style:normal;color:var(--soft)}
.mark{position:absolute;z-index:3;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E4D8FF,var(--violet) 50%,#2a1870 100%);box-shadow:0 0 80px rgba(124,92,255,.6)}
.big{text-align:center;font:700 44px var(--head);letter-spacing:-.02em}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv" width="1080" height="1350"></canvas>
<div id="bar"></div>
<div id="brand"><i></i><span id="brandName"></span></div>
<div id="count"></div>
</div>

<script>
/* =====================================================================
   CONFIG - edit only this block. Canvas 1080x1350, side padding 72.
   Text block (kicker/h1/sub/tags) occupies top ~150-520px.
   Place els + art in bottom area (~530-1300px). Coordinates in px.

   Slide: { dur, kicker, title(html, <em> = accent), sub?, tags?:[[text,color]],
            art:{layout, ...params}, els:[...] }
   Colors: violet soft gold teal rose muted ink
   Code line html classes: k=key s=string c=comment p=punct
   Code line: 'html' | { h:'html', in?, hl?, diff?:'+'|'-' }
   Morph token inside line: <span data-morph="2.0">from|to</span>
   Elements (all accept in = appear time in s, local to slide):
     code  {top, size?, pad?, stagger?(0 = lines appear with panel), lines}
     cards {top, cols?, h?, gap?, step?, items:[{label,key,val,color}]}
     hub   {x, y (center), size?, label, color?:'violet'|'teal'|'gold'|'rose'}
     nodes {y, xs:[centers], labels, step?}
     cmd   {top, text}
     note  {top, html}
     tips  {top, step?, items:[{code?|title?, desc, badge?}], stagger?}
     mark  {x, y (center)}
     big   {top, text}
   Particle layouts (art.layout):
     scatter {labels?:[[text,x,y,color]]}   floating, optional canvas labels
     chaos   {y?, h?}                        jittery cloud + tangled lines
     hub     {x, y}                          orbit around one point
     flows   {x, y, xs:[], ty}               hub -> targets streams + lines
     twoHubs {a:[x,y], b:[x,y], colors?}     two orbits
     wave    {top, rows?, cols?, origin:[x,y], at?}  grid lit by expanding front
     stream  {top, h}                        vertical flow top -> bottom
     field   {}                              faint ambient dots everywhere
     ring    {x, y}                          three concentric rings
   ===================================================================== */
const BRAND = 'polubinski.dev';
const SLIDES = [
  { dur: 4.6, kicker: 'the hook', title: 'Version drift in your <em>monorepo</em>?',
    sub: 'one line in pnpm-workspace.yaml fixes it', tags: [['pnpm', 'violet'], ['catalog:', 'gold']],
    art: { layout: 'scatter', labels: [['react ^18.2.0', 200, 720, 'rose'], ['react ^19.0.0', 600, 700, 'teal'], ['zod ^3.22.4', 380, 850, 'gold'],
      ['react ^18.3.1', 700, 890, 'soft'], ['zod ^3.23.8', 150, 1010, 'gold'], ['react-dom ^18.2.0', 560, 1060, 'rose'],
      ['react ^19.1.0', 250, 1190, 'teal'], ['zod ^4.0.0', 700, 1210, 'soft']] },
    els: [] },
  // kind: cards (+ small code panel)
  { dur: 5.4, kicker: 'the problem', title: 'Every package picks its <em>own</em> react',
    sub: '4 packages / 4 versions / 1 mess', tags: [['duplicates in lockfile', 'rose']],
    art: { layout: 'chaos' },
    els: [
      { type: 'cards', top: 665, in: .3, items: [
        { label: 'apps/web', key: 'react', val: '^18.2.0', color: 'rose' }, { label: 'apps/admin', key: 'react', val: '^18.3.1', color: 'gold' },
        { label: 'libs/ui', key: 'react', val: '^19.0.0', color: 'teal' }, { label: 'libs/auth', key: 'react', val: '^19.1.0', color: 'soft' }] },
      { type: 'code', top: 1095, in: 1.6, size: 26, pad: '22px 34px', lines: [
        { h: '<span class="c"># pnpm-lock.yaml</span>', in: 1.6 },
        { h: '<span class="k">react@18.2.0</span>  <span class="k">react@18.3.1</span>', in: 2.0 },
        { h: '<span class="k">react@19.0.0</span>  <span class="k">react@19.1.0</span>  <span style="color:var(--rose)">x4</span>', in: 2.4 }] }] },
  // kind: text + code + hub
  { dur: 5.6, kicker: 'the concept', title: 'One <em>source</em> of truth',
    sub: 'define versions once, at the root', tags: [['pnpm 9.5+', 'teal'], ['catalog:', 'violet']],
    art: { layout: 'hub', x: 540, y: 1120 },
    els: [
      { type: 'code', top: 530, in: .2, lines: [
        '<span class="c"># pnpm-workspace.yaml</span>', '<span class="k">packages</span><span class="p">:</span>',
        '<span class="p">  - </span><span class="s">"apps/*"</span>', '<span class="p">  - </span><span class="s">"libs/*"</span>',
        { h: '<span class="k">catalog</span><span class="p">:</span>', hl: 2.0 },
        { h: '<span class="p">  </span><span class="k">react</span><span class="p">: </span><span class="s">^19.1.0</span>', hl: 2.2 },
        { h: '<span class="p">  </span><span class="k">zod</span><span class="p">: </span><span class="s">^4.1.0</span>', hl: 2.4 }] },
      { type: 'hub', x: 540, y: 1120, size: 120, label: 'catalog', in: 1.0 }] },
  // kind: code + hub -> nodes (flows)
  { dur: 5.4, kicker: 'usage', title: 'Reference it with <em>catalog:</em>', sub: 'no version numbers in package.json',
    art: { layout: 'flows', x: 540, y: 1085, xs: [165, 405, 675, 915], ty: 1225 },
    els: [
      { type: 'code', top: 600, in: .2, lines: [
        '<span class="c">// apps/web/package.json</span>', '<span class="p">{</span>',
        '<span class="p">  </span><span class="k">"dependencies"</span><span class="p">: {</span>',
        { h: '<span class="p">    </span><span class="k">"react"</span><span class="p">: </span><span class="s">"catalog:"</span><span class="p">,</span>', hl: 1.8 },
        { h: '<span class="p">    </span><span class="k">"zod"</span><span class="p">: </span><span class="s">"catalog:"</span>', hl: 2.0 },
        '<span class="p">  }</span>', '<span class="p">}</span>'] },
      { type: 'hub', x: 540, y: 1085, size: 90, label: 'catalog', in: 1.4 },
      { type: 'nodes', y: 1225, xs: [165, 405, 675, 915], labels: ['apps/web', 'apps/admin', 'libs/ui', 'libs/auth'], in: 1.8 }] },
  // kind: variant (two hubs)
  { dur: 5.6, kicker: 'named catalogs', title: 'Two majors? <em>Name</em> them', sub: 'catalogs: with any names you like',
    art: { layout: 'twoHubs', a: [300, 1195], b: [780, 1195] },
    els: [
      { type: 'code', top: 560, in: .2, lines: [
        '<span class="c"># pnpm-workspace.yaml</span>', '<span class="k">catalogs</span><span class="p">:</span>',
        '<span class="p">  </span><span class="k" style="color:var(--teal)">react18</span><span class="p">:</span>',
        '<span class="p">    </span><span class="k">react</span><span class="p">: </span><span class="s">^18.3.1</span>',
        '<span class="p">  </span><span class="k">react19</span><span class="p">:</span>',
        '<span class="p">    </span><span class="k">react</span><span class="p">: </span><span class="s">^19.1.0</span>',
        { h: '<span class="k">"react"</span><span class="p">: </span><span class="s">"catalog:react18"</span>', hl: 2.4 }] },
      { type: 'hub', x: 300, y: 1195, size: 100, label: 'react18', color: 'teal', in: 1.2 },
      { type: 'hub', x: 780, y: 1195, size: 100, label: 'react19', in: 1.4 }] },
  // kind: diff + wave payoff
  { dur: 5.6, kicker: 'upgrades', title: 'Upgrade in <em>one</em> line', sub: 'bump once, the whole repo follows', tags: [['single diff', 'gold']],
    art: { layout: 'wave', top: 870, origin: [540, 770], at: 1.7 },
    els: [
      { type: 'code', top: 530, in: .2, lines: [
        '<span class="c"># pnpm-workspace.yaml</span>', '<span class="k">catalog</span><span class="p">:</span>',
        { diff: '-', h: '<span class="k">react</span><span class="p">: </span><span class="s">^19.0.0</span>', in: .8 },
        { diff: '+', h: '<span class="k">react</span><span class="p">: </span><span class="s">^19.1.0</span>', in: 1.2 }] },
      { type: 'note', top: 1210, in: 3.6, html: '<b>21 packages</b> on ^19.1.0 after pnpm install' }] },
  // kind: morph token + cmd + stream
  { dur: 5.6, kicker: 'publishing', title: 'Publish stays <em>safe</em>', sub: 'catalog: becomes a real version range',
    tags: [['pnpm pack', 'violet'], ['pnpm publish', 'gold']],
    art: { layout: 'stream', top: 690, h: 190 },
    els: [
      { type: 'code', top: 540, in: .2, size: 31, stagger: 0, lines: [
        '<span class="c">// apps/web/package.json</span>',
        { h: '<span class="k">"react"</span><span class="p">: </span><span class="s">"catalog:"</span>', hl: 1.0 }] },
      { type: 'cmd', top: 760, in: .8, text: '$ pnpm publish' },
      { type: 'code', top: 880, in: 1.2, size: 31, stagger: 0, lines: [
        '<span class="c">// published package.json</span>',
        { h: '<span class="k">"react"</span><span class="p">: </span><span class="s">"<span data-morph="2.0">catalog:|^19.1.0</span>"</span>', hl: 3.0 }] },
      { type: 'note', top: 1100, in: 3.4, html: 'consumers never see <b>catalog:</b>' }] },
  // kind: tips cards
  { dur: 5.8, kicker: 'pro tips', title: 'Lock it <em>down</em>', sub: 'small settings, big payoff',
    art: { layout: 'field' },
    els: [
      { type: 'tips', top: 560, in: .4, items: [
        { code: '<span class="k">catalogMode</span><span class="p">: </span><span class="s">strict</span>', desc: 'pnpm add only allows versions<br>from the catalog', badge: 'pnpm 10.12.1+' },
        { code: '<span class="p">pnpm add zod </span><span class="k">--save-catalog</span>', desc: 'adds the dep and writes its version<br>into the catalog for you', badge: 'pnpm 10.12.1+' },
        { title: 'Fewer <em>merge conflicts</em>', desc: 'upgrades touch one file,<br>not every package.json' }] }] },
  // kind: CTA
  { dur: 5.0, kicker: 'your turn', title: 'Do you use <em>catalogs</em>?', sub: 'follow for more monorepo tips',
    tags: [['comment', 'violet'], ['share', 'gold'], ['follow', 'teal']],
    art: { layout: 'ring', x: 540, y: 910 },
    els: [{ type: 'mark', x: 540, y: 910, in: .3 }, { type: 'big', top: 1200, in: .8, text: BRAND }] },
];
/* ============================ END CONFIG ============================ */

const pad2 = (n) => String(n).padStart(2, '0');
const HUBC = { violet: ['var(--soft)', '124,92,255'], teal: ['var(--teal)', '79,209,197'], gold: ['var(--gold)', '232,197,71'], rose: ['var(--rose)', '255,107,138'] };
const at = (v) => (v == null ? '' : ` data-in="${v}"`);
function lineHtml(l, i, el) {
  const o = typeof l === 'string' ? { h: l } : l;
  const tin = o.in ?? (el.stagger === 0 ? null : (el.in ?? 0) + .1 + i * (el.stagger ?? .15));
  const cls = o.diff === '-' ? ' del' : o.diff === '+' ? ' add' : '';
  const pre = o.diff ? `<span class="m">${o.diff} </span><span class="p"> </span>` : '';
  return `<div class="ln${cls}"${at(tin)}${o.hl != null ? ` data-hl="${o.hl}"` : ''}>${pre}${o.h}</div>`;
}
function elHtml(e) {
  switch (e.type) {
    case 'code': return `<div class="code"${at(e.in)} style="top:${e.top}px;${e.size ? `font-size:${e.size}px;` : ''}${e.pad ? `padding:${e.pad};` : ''}">${e.lines.map((l, i) => lineHtml(l, i, e)).join('')}</div>`;
    case 'cards': {
      const cols = e.cols ?? 2, gap = e.gap ?? 24, h = e.h ?? 190, w = (936 - gap * (cols - 1)) / cols;
      return e.items.map((c, i) => `<div class="card"${at((e.in ?? 0) + i * (e.step ?? .2))} style="left:${72 + (i % cols) * (w + gap)}px;top:${e.top + Math.floor(i / cols) * (h + gap)}px;width:${w}px;height:${h}px"><div class="pkg">${c.label}</div><div class="ver"><b>${c.key}</b><span style="color:var(--${c.color ?? 'gold'})">${c.val}</span></div></div>`).join('');
    }
    case 'hub': {
      const s = e.size ?? 110, [hc, hr] = HUBC[e.color ?? 'violet'];
      return `<div class="hub"${at(e.in)} style="left:${e.x - s / 2}px;top:${e.y - s / 2}px;width:${s}px;height:${s}px;font-size:${Math.round(s * .19)}px;--hc:${hc};--hr:${hr}">${e.label}</div>`;
    }
    case 'nodes': return e.xs.map((x, i) => `<div class="node"${at((e.in ?? 0) + i * (e.step ?? .15))} style="left:${x - 92}px;top:${e.y}px">${e.labels[i]}</div>`).join('');
    case 'cmd': return `<div class="cmd"${at(e.in)} style="top:${e.top}px">${e.text}</div>`;
    case 'note': return `<div class="abs note"${at(e.in)} style="left:72px;right:72px;top:${e.top}px">${e.html}</div>`;
    case 'tips': return e.items.map((t, i) => `<div class="card tip"${at((e.in ?? 0) + i * (e.stagger ?? .8))} style="top:${e.top + i * (e.step ?? 214)}px">${t.code ? `<div class="t">${t.code}</div>` : `<h3>${t.title}</h3>`}<div class="d">${t.desc}</div>${t.badge ? `<span class="badge">${t.badge}</span>` : ''}</div>`).join('');
    case 'mark': return `<div class="mark"${at(e.in)} style="left:${e.x - 75}px;top:${e.y - 75}px"></div>`;
    case 'big': return `<div class="abs big"${at(e.in)} style="left:72px;right:72px;top:${e.top}px">${e.text}</div>`;
    default: throw new Error('unknown el ' + e.type);
  }
}
const stage = document.getElementById('stage');
stage.insertAdjacentHTML('beforeend', SLIDES.map((s, i) => `<section class="slide"><div class="ghost">${pad2(i + 1)}</div><div class="copy">
  <div class="kicker">${pad2(i + 1)} / ${s.kicker}</div><h1>${s.title}</h1>${s.sub ? `<div class="sub">${s.sub}</div>` : ''}
  ${s.tags?.length ? `<div class="tags">${s.tags.map(([t, c]) => `<span class="tag" style="--c:var(--${c})">${t}</span>`).join('')}</div>` : ''}
  </div>${(s.els ?? []).map(elHtml).join('')}</section>`).join(''));
document.getElementById('brandName').textContent = BRAND;

// ---------------- engine: all state derived from t ----------------
const DUR = SLIDES.map((s) => s.dur);
const START = []; let acc = 0; for (const d of DUR) { START.push(acc); acc += d; }
const TOTAL = acc; window.TOTAL_MS = TOTAL * 1000;
window.SLIDE_MID_MS = START.map((s, i) => Math.round((s + DUR[i] * .72) * 1000));
const slides = [...document.querySelectorAll('.slide')];
const cl = (v) => Math.max(0, Math.min(1, v));
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eo = (x) => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, t) => a + (b - a) * t;
const C = { violet: [124, 92, 255], soft: [180, 140, 255], gold: [232, 197, 71], teal: [79, 209, 197], rose: [255, 107, 138], muted: [138, 135, 160], ink: [255, 255, 255] };
const PAL = [C.violet, C.soft, C.gold, C.teal, C.rose];
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(42); const N = 170; const TAU = Math.PI * 2;
const parts = Array.from({ length: N }, (_, i) => ({ i, r: Array.from({ length: 10 }, R), shape: i % 4 }));
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const drift = (p, t, a) => [Math.sin(t * .5 + p.r[6] * TAU) * a, Math.cos(t * .42 + p.r[7] * TAU) * a];
const LAYOUTS = {
  scatter(p, t, lt, A) {
    const r = p.r, L = A.labels?.[p.i]; let x, y, c, s = 4 + r[1] * 5, a = .8;
    if (L) { x = L[1]; y = L[2]; c = C[L[3]]; s = 9; a = 1; }
