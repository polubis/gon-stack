<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explainer deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<style>
@font-face{font-family:Aspekta;font-weight:400;font-display:block;src:url(fonts/Aspekta-400.woff2) format('woff2')}
@font-face{font-family:Aspekta;font-weight:500;font-display:block;src:url(fonts/Aspekta-500.woff2) format('woff2')}
@font-face{font-family:Aspekta;font-weight:700;font-display:block;src:url(fonts/Aspekta-700.woff2) format('woff2')}
/* polubinski.dev tokens: bg #000100, fg #d7d8d9, fg-2 #888, primary 400 #0dd97d / 500 #0bad67 */
:root{--bg:#000100;--ink:#d7d8d9;--muted:#888;--green:#0dd97d;--green2:#0bad67;--line:rgba(255,255,255,.1);--panel:#070908;
  --str:#e8d9a0;--com:#6d716f;--err:#ff7b72;--sans:'Aspekta',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg)}
canvas{position:absolute;inset:0;z-index:1}
#bar{position:absolute;top:0;left:0;height:4px;z-index:10;background:linear-gradient(90deg,var(--green2),var(--green));box-shadow:0 0 12px rgba(13,217,125,.6)}
#brand{position:absolute;top:40px;left:72px;z-index:10;display:flex;align-items:center;gap:16px;font:500 26px var(--sans);letter-spacing:-.01em}
#brand img{width:60px;height:60px}
#count{position:absolute;top:58px;right:72px;z-index:10;font:500 22px var(--mono);color:var(--muted);letter-spacing:.08em}
.slide{position:absolute;inset:0;z-index:2;opacity:0}
.copy{position:absolute;top:160px;left:72px;right:72px;z-index:3}
.kicker{font:500 22px var(--mono);color:var(--green);text-transform:uppercase;letter-spacing:.12em;margin-bottom:22px}
h1{font:500 76px/1.08 var(--sans);letter-spacing:-.025em;max-width:936px}
h1 em{font-style:normal;color:var(--green)}
.cur{display:inline-block;width:.42em;height:.09em;margin-left:.12em;background:var(--green);vertical-align:baseline;box-shadow:0 0 14px rgba(13,217,125,.7)}
.sub{margin-top:24px;font:400 32px/1.35 var(--sans);color:var(--muted);max-width:900px}
.sub b{color:var(--ink);font-weight:500}
.abs{position:absolute;z-index:3}
.code{position:absolute;left:72px;right:72px;z-index:3;border-radius:16px;border:1px solid var(--line);background:var(--panel);overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.6);font:500 30px/1.55 var(--mono);font-variant-ligatures:none}
.code .hd{display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--line);font:500 20px var(--mono);color:var(--muted);letter-spacing:.02em}
.code .hd:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.code .bd{padding:22px 26px 24px}
.ln{white-space:pre;border-radius:6px;margin:0 -12px;padding:0 12px}
.k{color:var(--green)}.s{color:var(--str)}.c{color:var(--com)}.p{color:var(--ink)}.e{color:var(--err)}.m{color:var(--muted)}
.ln.del{background:rgba(255,123,114,.10)}.ln.add{background:rgba(13,217,125,.10)}
.node{position:absolute;z-index:3;height:60px;display:flex;align-items:center;justify-content:center;padding:0 22px;border-radius:999px;
  font:500 22px var(--mono);background:var(--panel);border:1px solid var(--line);color:var(--ink);font-variant-ligatures:none;transform:translateX(-50%)}
.node.on{border-color:rgba(13,217,125,.55);color:var(--green);box-shadow:0 0 24px rgba(13,217,125,.25)}
.node.bad{border-color:rgba(255,123,114,.6);color:var(--err)}
.note{left:72px;right:72px;font:400 30px/1.4 var(--sans);color:var(--muted);text-align:center}
.note b{color:var(--ink);font-weight:500}
.row{left:72px;right:72px;padding:26px 30px;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.row .t{font:500 30px var(--mono);font-variant-ligatures:none}
.row .d{margin-top:12px;font:400 27px/1.35 var(--sans);color:var(--muted)}
.logo{position:absolute;z-index:3}
.big{left:72px;right:72px;text-align:center;font:500 46px var(--sans);letter-spacing:-.02em}
.link{left:72px;right:72px;text-align:center;font:500 28px var(--mono);color:var(--green)}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv" width="1080" height="1350"></canvas>
<div id="bar"></div>
<div id="brand"><img src="logo.svg" alt=""><span id="brandName"></span></div>
<div id="count"></div>
</div>

<script>
/* =====================================================================
   CONFIG - edit only this block. Build it FROM the approved skeleton.md.
   Canvas 1080x1350, side padding 72, content width 936.
   Copy block (kicker/title/sub) starts at top 160 and ends ~360-520.
   Proof (code) sits right below copy. Visuals only where skeleton says so.

   Slide: { dur, kicker?, title(html, <em> = green), sub?(html, <b> = ink),
            cursor?(green blinking _ after title, brand mark - hook/CTA),
            art?:{layout, ...}, els:[...] }
   Code line html classes: k=keyword/green s=string c=comment p=plain e=error m=muted
   Code line: 'html' | { h:'html', in?, hl?, diff?:'+'|'-' }
   Morph token inside line: <span data-morph="2.0">from|to</span>  (type-on change)
   Elements (all accept in = appear time s, slide-local):
     code  {top, file?(header label: path or 'terminal'), size?(30, min 26), stagger?(.15, 0 = all at once), lines}
     nodes {y, xs:[centers], labels, step?, on?:[idx], onAt?(s | [s per on idx]), bad?:[idx], badAt?}
     note  {top, html}
     list  {top, step?(h of row + gap, 170), items:[{t:'code html', d:'text'}]}
     logo  {x, y (center), size?}
     big   {top, text}
     link  {top, text}
   Art (optional, canvas, only when it explains something):
     flow  {from:[x,y], to:[[x,y],..], at?}   one source fans out into many results
     pipe  {points:[[x,y],..], at?, fail?}    one item passes ordered steps (rail under nodes, reaches point k at at+.7k); fail = red at last
     glow  {x, y, r?}                          brand orb behind logo (CTA only)
   Ambient star field is always on (static, faint) - not a visual by itself.
   ===================================================================== */
const BRAND = 'polubinski.dev';
const SLIDES = [
  { dur: 6.0, title: 'Version drift in your <em>monorepo</em>?', cursor: true,
    sub: 'Every package pins its own <b>react</b>.',
    els: [
      { type: 'code', top: 470, in: .3, file: 'pnpm-lock.yaml', lines: [
        '<span class="p">react@</span><span class="e">18.2.0</span>', '<span class="p">react@</span><span class="e">18.3.1</span>',
        '<span class="p">react@</span><span class="e">19.0.0</span>', { h: '<span class="m">4 copies of one dependency</span>', in: 1.6 }] }] },
  { dur: 6.5, kicker: 'catalog', title: 'Define it <em>once</em>',
    art: { layout: 'flow', from: [540, 960], to: [[200, 1150], [540, 1150], [880, 1150]], at: 1.8 },
    els: [
      { type: 'code', top: 400, in: .3, file: 'pnpm-workspace.yaml', lines: [
        '<span class="k">catalog</span><span class="p">:</span>',
        { h: '<span class="p">  react: </span><span class="s">^19.1.0</span>', hl: 1.2 }] },
      { type: 'nodes', y: 1150, xs: [200, 540, 880], labels: ['apps/web', 'apps/admin', 'libs/ui'], in: 2.0, on: [0, 1, 2], onAt: 2.6 }] },
  { dur: 5.0, title: 'Do you use <em>catalogs</em>?', cursor: true, sub: 'Comment, share, follow.',
    art: { layout: 'glow', x: 540, y: 820 },
    els: [{ type: 'logo', x: 540, y: 820, size: 260, in: .3 }, { type: 'big', top: 1080, in: .8, text: BRAND }] },
];
/* ============================ END CONFIG ============================ */

const pad2 = (n) => String(n).padStart(2, '0');
const at = (v) => (v == null ? '' : ` data-in="${v}"`);
function lineHtml(l, i, el) {
  const o = typeof l === 'string' ? { h: l } : l;
  const tin = o.in ?? (el.stagger === 0 ? null : (el.in ?? 0) + .1 + i * (el.stagger ?? .15));
  const cls = o.diff === '-' ? ' del' : o.diff === '+' ? ' add' : '';
  const pre = o.diff ? `<span class="${o.diff === '-' ? 'e' : 'k'}">${o.diff} </span>` : '';
  return `<div class="ln${cls}"${at(tin)}${o.hl != null ? ` data-hl="${o.hl}"` : ''}>${pre}${o.h}</div>`;
}
function elHtml(e) {
  switch (e.type) {
    case 'code': return `<div class="code"${at(e.in)} style="top:${e.top}px;${e.size ? `font-size:${e.size}px;` : ''}">${e.file ? `<div class="hd">${e.file}</div>` : ''}<div class="bd">${e.lines.map((l, i) => lineHtml(l, i, e)).join('')}</div></div>`;
    case 'nodes': return e.xs.map((x, i) => `<div class="node"${at((e.in ?? 0) + i * (e.step ?? .15))}${e.on?.includes(i) ? ` data-on="${Array.isArray(e.onAt) ? e.onAt[e.on.indexOf(i)] : e.onAt ?? 0}"` : ''}${e.bad?.includes(i) ? ` data-bad="${e.badAt ?? 0}"` : ''} style="left:${x}px;top:${e.y - 30}px">${e.labels[i]}</div>`).join('');
    case 'note': return `<div class="abs note"${at(e.in)} style="top:${e.top}px">${e.html}</div>`;
    case 'list': return e.items.map((r, i) => `<div class="abs row"${at((e.in ?? 0) + i * (e.stagger ?? .5))} style="top:${e.top + i * (e.step ?? 170)}px"><div class="t">${r.t}</div><div class="d">${r.d}</div></div>`).join('');
    case 'logo': { const s = e.size ?? 220; return `<img class="logo" src="logo.svg" alt=""${at(e.in)} style="left:${e.x - s / 2}px;top:${e.y - s / 2}px;width:${s}px;height:${s}px">`; }
    case 'big': return `<div class="abs big"${at(e.in)} style="top:${e.top}px">${e.text}</div>`;
    case 'link': return `<div class="abs link"${at(e.in)} style="top:${e.top}px">${e.text}</div>`;
    default: throw new Error('unknown el ' + e.type);
  }
}
const stage = document.getElementById('stage');
stage.insertAdjacentHTML('beforeend', SLIDES.map((s) => `<section class="slide"><div class="copy">
  ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ''}<h1>${s.title}${s.cursor ? '<span class="cur"></span>' : ''}</h1>${s.sub ? `<div class="sub">${s.sub}</div>` : ''}
  </div>${(s.els ?? []).map(elHtml).join('')}</section>`).join(''));
document.getElementById('brandName').textContent = BRAND;

// ---------------- engine: all state derived from t ----------------
const DUR = SLIDES.map((s) => s.dur);
const START = []; let acc = 0; for (const d of DUR) { START.push(acc); acc += d; }
const TOTAL = acc; window.TOTAL_MS = TOTAL * 1000;
window.SLIDE_MID_MS = START.map((s, i) => Math.round((s + DUR[i] * .8) * 1000));
const slides = [...document.querySelectorAll('.slide')];
const cl = (v) => Math.max(0, Math.min(1, v));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(a, b) { let h = Math.imul(a * 374761393 + b * 668265263, 1274126177); h ^= h >>> 13; return (h >>> 0) / 4294967296; }
const R = rng(7), TAU = Math.PI * 2;
const STARS = Array.from({ length: 130 }, () => ({ x: R() * 1080, y: R() * 1350, s: .8 + R() * 1.6, a: .12 + R() * .35, g: R() < .35, ph: R() * TAU }));
const GREEN = [13, 217, 125], RED = [255, 123, 114];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const ART = {
  flow(A, lt, v) {
    const t0 = A.at ?? 1.5, p = cl((lt - t0) / .8);
    ctx.lineWidth = 2;
    for (const [i, [tx, ty]] of A.to.entries()) {
      const [fx, fy] = A.from, e = eo(p);
      ctx.strokeStyle = rgba(GREEN, .35 * v); ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(lerp(fx, tx, e), lerp(fy, ty, e)); ctx.stroke();
      if (p < 1) continue;
      for (let k = 0; k < 3; k++) {
        const f = ((lt - t0 - .8) * .55 + k / 3 + i * .13) % 1;
        ctx.fillStyle = rgba(GREEN, Math.sin(Math.PI * f) * v); ctx.shadowColor = rgba(GREEN, .9); ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(lerp(fx, tx, f), lerp(fy, ty, f), 5, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
      }
    }
  },
  pipe(A, lt, v) {
    const P = A.points, t0 = A.at ?? 1.5, seg = .7, n = P.length - 1;
    ctx.lineWidth = 2; ctx.strokeStyle = rgba([255, 255, 255], .14 * v);
    ctx.beginPath(); P.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    const f = cl((lt - t0) / (seg * n)), pos = f * n, i = Math.min(n - 1, Math.floor(pos)), u = pos - i;
    const done = Math.floor(pos);
    ctx.strokeStyle = rgba(GREEN, .7 * v); ctx.beginPath(); ctx.moveTo(...P[0]);
    for (let k = 1; k <= done && k <= n; k++) ctx.lineTo(...P[k]);
    if (f < 1) ctx.lineTo(lerp(P[i][0], P[i + 1][0], u), lerp(P[i][1], P[i + 1][1], u)); ctx.stroke();
    const c = A.fail && f >= 1 ? RED : GREEN, x = f >= 1 ? P[n][0] : lerp(P[i][0], P[i + 1][0], u), y = f >= 1 ? P[n][1] : lerp(P[i][1], P[i + 1][1], u);
    if (lt < t0) return;
    ctx.fillStyle = rgba(c, v); ctx.shadowColor = rgba(c, .9); ctx.shadowBlur = 18; ctx.beginPath(); ctx.arc(x, y, 9, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  },
  glow(A, lt, v) {
    const r = A.r ?? 300, g = ctx.createRadialGradient(A.x, A.y, 0, A.x, A.y, r);
    const k = .55 + .1 * Math.sin(lt * 1.4);
    g.addColorStop(0, rgba(GREEN, .28 * k * v)); g.addColorStop(.5, rgba([11, 173, 103], .10 * k * v)); g.addColorStop(1, rgba(GREEN, 0));
    ctx.fillStyle = g; ctx.fillRect(A.x - r, A.y - r, r * 2, r * 2);
  },
};
function draw(t, vis) {
  ctx.clearRect(0, 0, 1080, 1350);
  for (const s of STARS) { ctx.fillStyle = s.g ? rgba(GREEN, s.a * (.7 + .3 * Math.sin(t * .8 + s.ph))) : `rgba(215,216,217,${s.a * .6})`; ctx.fillRect(s.x, s.y, s.s, s.s); }
  SLIDES.forEach((s, j) => { if (s.art && vis[j] > 0) ART[s.art.layout](s.art, t - START[j], vis[j]); });
}
const SCR = 'abcdefghijklmnopqrstuvwxyz0123456789';
function morph(el, local) {
  const t0 = +el.dataset.morph, [a, b] = el.dataset.src.split('|'), p = cl((local - t0) / .8);
  if (p <= 0) { el.textContent = a; return; }
  if (p >= 1) { el.textContent = b; return; }
  const L = Math.round(lerp(a.length, b.length, p)), f = Math.floor(local * 24); let s = '';
  for (let i = 0; i < L; i++) s += p >= (i + 1) / (L + 1) ? b[i] ?? '' : SCR[Math.floor(hash(i + 1, f) * SCR.length)];
  el.textContent = s;
}
document.querySelectorAll('[data-morph]').forEach((el) => el.dataset.src = el.textContent);
const TOT = pad2(SLIDES.length);
function slideAt(t) { let k = 0; for (let i = 0; i < START.length; i++) if (t >= START[i]) k = i; return k; }
window.renderAt = function (ms) {
  const t = Math.max(0, Math.min(TOTAL - 1e-3, ms / 1000)), vis = [];
  slides.forEach((sl, j) => {
    const s = START[j], e = s + DUR[j];
    const vin = j === 0 ? 1 : cl((t - s) / .5), vout = j === slides.length - 1 ? 1 : cl((e - t) / .3);
    const v = (t < s - .001 || t > e) ? 0 : vin * vout; vis.push(v);
    sl.style.opacity = v; sl.style.visibility = v > 0 ? 'visible' : 'hidden';
    if (v <= 0) return;
    const local = t - s;
    sl.querySelector('.copy').style.transform = `translateY(${(1 - eo(vin)) * 24 - (1 - vout) * 12}px)`;
    sl.querySelectorAll('[data-in]').forEach((el) => {
      const a = cl((local - +el.dataset.in) / .4); el.style.opacity = a;
      el.style.transform = (el.classList.contains('node') ? 'translateX(-50%) ' : '') + `translateY(${(1 - eo(a)) * 14}px)`;
    });
    sl.querySelectorAll('[data-hl]').forEach((el) => { const a = cl((local - +el.dataset.hl) / .35); el.style.background = `rgba(13,217,125,${.12 * a})`; el.style.boxShadow = `inset 4px 0 0 rgba(13,217,125,${a})`; });
    sl.querySelectorAll('[data-on]').forEach((el) => el.classList.toggle('on', local >= +el.dataset.on));
    sl.querySelectorAll('[data-bad]').forEach((el) => el.classList.toggle('bad', local >= +el.dataset.bad));
    sl.querySelectorAll('.cur').forEach((el) => el.style.opacity = Math.floor(local * 1.6) % 2 ? .15 : 1);
    sl.querySelectorAll('[data-morph]').forEach((el) => morph(el, local));
  });
  draw(t, vis);
  document.getElementById('bar').style.width = (t / TOTAL * 1080) + 'px';
  document.getElementById('count').textContent = pad2(slideAt(t) + 1) + '/' + TOT;
};
const imgs = [...document.images].map((im) => im.complete ? Promise.resolve() : new Promise((r) => { im.onload = im.onerror = r; }));
window.ready = Promise.all([document.fonts.ready, document.fonts.load('500 30px "JetBrains Mono"'), document.fonts.load('500 76px Aspekta'),
  document.fonts.load('400 32px Aspekta'), ...imgs]).then(() => document.fonts.ready);
if (!location.search.includes('capture')) { window.ready.then(() => { const t0 = performance.now(); const loop = () => { renderAt((performance.now() - t0) % (TOTAL * 1000)); requestAnimationFrame(loop); }; loop(); }); }
else renderAt(0);
</script>
</body>
</html>
